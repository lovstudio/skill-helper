[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lovstudio-skill-helper"
version = "0.10.0"
description = "Lovstudio skill helper — activate and manage Lovstudio license keys and call cloud-split Skill handlers."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Lovstudio", email = "mark@lovstudio.ai" },
]
keywords = ["lovstudio", "skills", "license", "agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pyyaml>=6",
]

[project.scripts]
lovstudio-skill-helper = "lovstudio_skill_helper.cli:main"

[project.urls]
Homepage = "https://lovstudio.ai"
Repository = "https://github.com/lovstudio/lovstudio-activate"
Issues = "https://github.com/lovstudio/lovstudio-activate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lovstudio_skill_helper"]
